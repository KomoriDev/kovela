<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="preload" href="/astrobox/covers/angrybirds.webp" as="image" type="image/webp" />
    <title>Kovela · AstroBox</title>
    <!--
      Critical CSS: theme tokens and the boot skeleton. It is inlined so the first
      paint needs nothing but this document; the rest of the styles ship inside the
      script bundle (see src/astrobox/main.ts).
    -->
    <style>
      :root {
        color-scheme: light;
        --page: #f6f4ef;
        --fg: #121419;
        --fg-2: rgba(18, 20, 25, 0.64);
        --fg-3: rgba(18, 20, 25, 0.42);
        --line: rgba(18, 20, 25, 0.08);
        --card: #ffffff;
        --chip: rgba(18, 20, 25, 0.05);
        --skeleton: rgba(18, 20, 25, 0.07);
        --shadow: 0 18px 40px -26px rgba(28, 38, 58, 0.38);
        --grad: linear-gradient(100deg, #2f7dff 0%, #12a9d6 52%, #19c18f 100%);
        --accent: #ff4b3a;
        --accent-2: #ffb03b;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        --font: "MiSans", "HarmonyOS Sans SC", -apple-system, "PingFang SC", "Segoe UI",
          "Microsoft YaHei", system-ui, sans-serif;
        --display: "Anton", "Impact", "Arial Narrow Bold", sans-serif;
        --gutter: 20px;
        --card-w: min(80vw, 380px);
      }
      :root[data-astrobox-theme="dark"] {
        color-scheme: dark;
        --page: #0b0c10;
        --fg: #f3f1ec;
        --fg-2: rgba(243, 241, 236, 0.66);
        --fg-3: rgba(243, 241, 236, 0.4);
        --line: rgba(255, 255, 255, 0.08);
        --card: #15171d;
        --chip: rgba(255, 255, 255, 0.06);
        --skeleton: rgba(255, 255, 255, 0.07);
        --shadow: 0 18px 40px -26px rgba(0, 0, 0, 0.8);
      }
      /* Until AstroBox reports its theme, follow the system as the best guess. */
      @media (prefers-color-scheme: dark) {
        :root:not([data-astrobox-theme]) {
          color-scheme: dark;
          --page: #0b0c10;
          --fg: #f3f1ec;
          --fg-2: rgba(243, 241, 236, 0.66);
          --fg-3: rgba(243, 241, 236, 0.4);
          --line: rgba(255, 255, 255, 0.08);
          --card: #15171d;
          --chip: rgba(255, 255, 255, 0.06);
          --skeleton: rgba(255, 255, 255, 0.07);
          --shadow: 0 18px 40px -26px rgba(0, 0, 0, 0.8);
        }
      }
      @media (min-width: 560px) {
        :root {
          --gutter: 28px;
          --card-w: min(44vw, 380px);
        }
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        position: relative;
        overflow-x: hidden;
        background: var(--page);
        color: var(--fg);
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }
      :root.astrobox-transparent,
      :root.astrobox-transparent body {
        background: transparent;
      }

      /* ---------- boot skeleton ---------- */

      .boot {
        position: absolute;
        z-index: 5;
        top: 0;
        right: 0;
        left: 0;
        display: grid;
        /* minmax(0, 1fr): the wider-than-screen rail must not widen the column. */
        grid-template-columns: minmax(0, 1fr);
        gap: 14px;
        padding: 22px var(--gutter) 0;
        overflow: hidden;
        pointer-events: none;
        transition: opacity 0.5s var(--ease);
      }
      .is-ready .boot {
        opacity: 0;
      }
      .sk {
        display: block;
        position: relative;
        overflow: hidden;
        border-radius: 10px;
        background: var(--skeleton);
      }
      /* One shared sweep so every block shimmers in sync. */
      .sk::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          100deg,
          transparent 20%,
          color-mix(in srgb, var(--fg) 8%, transparent) 50%,
          transparent 80%
        );
        background-size: 200vw 100%;
        background-attachment: fixed;
        animation: sweep 1.6s linear infinite;
      }
      @keyframes sweep {
        from {
          background-position: 100vw 0;
        }
        to {
          background-position: -100vw 0;
        }
      }
      .boot-brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .boot-mark {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: var(--grad);
        animation: breathe 1.6s ease-in-out infinite;
      }
      @keyframes breathe {
        50% {
          opacity: 0.55;
          transform: scale(0.92);
        }
      }
      .boot-name {
        width: 76px;
        height: 16px;
      }
      .boot-tag {
        width: 118px;
        height: 24px;
        margin-left: auto;
        border-radius: 999px;
      }
      /* Sizes track the real hero so the hand-off does not jump. */
      .boot-title {
        width: 72%;
        height: clamp(34px, 11vw, 50px);
        margin-top: 6px;
        border-radius: 12px;
      }
      .boot-title.is-short {
        width: 58%;
        margin-top: -8px;
      }
      .boot-stats {
        display: flex;
        gap: 22px;
        margin-top: 4px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }
      .boot-stat {
        width: 64px;
        height: 43px;
      }
      /* Two 14px lines at the lede's 24.5px line pitch. */
      .boot-lede {
        display: grid;
        gap: 10px;
        padding-block: 5px;
      }
      .boot-line {
        width: 92%;
        height: 14px;
      }
      .boot-line.is-short {
        width: 54%;
      }
      .boot-tabs {
        width: min(330px, 100%);
        height: 45px;
        margin-top: 4px;
        border-radius: 999px;
      }
      .boot-rail {
        display: flex;
        min-width: 0;
        gap: 12px;
        margin: 4px calc(var(--gutter) * -1) 0;
        padding: 6px calc((100vw - var(--card-w)) / 2) 0;
      }
      .boot-card {
        display: grid;
        flex: none;
        gap: 12px;
        width: var(--card-w);
        padding: 8px 8px 14px;
        border: 1px solid var(--line);
        border-radius: 26px;
        background: var(--card);
      }
      .boot-art {
        aspect-ratio: 3 / 2;
        border-radius: 19px;
      }
      .boot-meta {
        height: 48px;
        margin: 0 6px;
        border-radius: 14px;
      }
      .boot-cta {
        height: 44px;
        margin: 2px 6px 0;
        border-radius: 999px;
      }
      @media (min-width: 560px) {
        .boot {
          padding-top: 28px;
        }
        .boot-rail {
          padding-inline: var(--gutter);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sk::after,
        .boot-mark {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="boot" aria-hidden="true">
      <div class="boot-brand">
        <span class="boot-mark"></span>
        <span class="sk boot-name"></span>
        <span class="sk boot-tag"></span>
      </div>
      <span class="sk boot-title"></span>
      <span class="sk boot-title is-short"></span>
      <div class="boot-lede">
        <span class="sk boot-line"></span>
        <span class="sk boot-line is-short"></span>
      </div>
      <div class="boot-stats">
        <span class="sk boot-stat"></span>
        <span class="sk boot-stat"></span>
        <span class="sk boot-stat"></span>
      </div>
      <span class="sk boot-tabs"></span>
      <div class="boot-rail">
        <div class="boot-card">
          <span class="sk boot-art"></span>
          <span class="sk boot-meta"></span>
          <span class="sk boot-cta"></span>
        </div>
        <div class="boot-card">
          <span class="sk boot-art"></span>
          <span class="sk boot-meta"></span>
          <span class="sk boot-cta"></span>
        </div>
      </div>
    </div>
    <main id="profile" class="profile" aria-label="Kovela 游戏" aria-busy="true"></main>
    <script type="module" src="/src/astrobox/main.ts"></script>
  </body>
</html>

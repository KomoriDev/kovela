[package]
name = "kovela-astrobox"
version = "1.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[features]
default = []
api4 = ["dep:wit-bindgen"]

[dependencies]
astrobox-ng-wit = "=0.3.1"
wit-bindgen = { version = "0.57.1", features = ["async", "async-spawn"], optional = true }
waki = "0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"

[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"
